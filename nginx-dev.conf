# Nginx Development Configuration für Ersatz
# Serviert statische Deployments lokal

server {
    listen 80;
    server_name localhost;

    root /var/ersatz/deployments;
    index index.html;

    # Logging
    access_log /var/log/nginx/ersatz-access.log;
    error_log /var/log/nginx/ersatz-error.log;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Default: Liste aller Deployments
    location = / {
        autoindex on;
    }

    # Projekt-spezifische Pfade
    # /projekt-name/ -> deployments/projekt-name/current/
    location ~ ^/([^/]+)(/.*)?$ {
        alias /var/ersatz/deployments/$1/current$2;
        try_files $uri $uri/ /index.html;

        # SPA Fallback für Unterseiten
        error_page 404 = @spa_fallback;
    }

    location @spa_fallback {
        rewrite ^/([^/]+)(/.*)?$ /$1/current/index.html last;
    }

    # Static Assets Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
