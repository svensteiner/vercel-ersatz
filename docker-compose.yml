version: "3.8"

services:
  # Deploy Server - Hauptservice
  deploy-server:
    build: .
    container_name: ersatz-server
    ports:
      - "9000:9000"
    volumes:
      - ersatz-data:/var/ersatz
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Für Container-Builds
    environment:
      - ERSATZ_BASE_DIR=/var/ersatz
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-change-me-in-production}
    restart: unless-stopped
    networks:
      - ersatz-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Caddy - Reverse Proxy mit Auto-SSL
  caddy:
    image: caddy:2-alpine
    container_name: ersatz-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ersatz-data:/var/ersatz:ro
      - caddy-data:/data
      - caddy-config:/config
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      - SSL_EMAIL=${SSL_EMAIL:-admin@example.com}
    restart: unless-stopped
    networks:
      - ersatz-network
    depends_on:
      - deploy-server

  # Optional: Redis für Caching/Sessions
  redis:
    image: redis:7-alpine
    container_name: ersatz-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - ersatz-network
    profiles:
      - full

volumes:
  ersatz-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  redis-data:
    driver: local

networks:
  ersatz-network:
    driver: bridge
