version: "3.8"

# Development Override
services:
  deploy-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./deploy-server:/app/deploy-server
      - ./builders:/app/builders
      - ./proxy:/app/proxy
      - ./cli:/app/cli
      - ersatz-data:/var/ersatz
    environment:
      - ERSATZ_BASE_DIR=/var/ersatz
      - WEBHOOK_SECRET=dev-secret
      - DEBUG=1
    command: uvicorn deploy-server.main:app --host 0.0.0.0 --port 9000 --reload

  # Lokaler Static File Server für Tests
  static-server:
    image: nginx:alpine
    container_name: ersatz-static-dev
    ports:
      - "8080:80"
    volumes:
      - ersatz-data:/var/ersatz/deployments:ro
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ersatz-network
